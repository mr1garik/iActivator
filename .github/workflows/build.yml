# Builds iActivator for Windows and macOS on GitHub's machines.
# Run it from the repository's Actions tab ("Run workflow"); the results appear as artifacts.
name: build
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false  # a missing macOS runner must not cancel the Windows build
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt -c constraints.txt
      - name: Tests
        run: python -m unittest discover tests
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: pyinstaller --noconfirm --onefile --windowed --name iActivator --icon assets/icon.ico --collect-all pymobiledevice3 --collect-all webview --collect-submodules keyring --collect-submodules pystray --collect-submodules PIL --collect-data fpdf --add-data "iactivator/page.html;iactivator" main.py
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --windowed --name iActivator --icon assets/icon.icns --collect-all pymobiledevice3 --collect-all webview --collect-submodules keyring --collect-data fpdf --add-data "iactivator/page.html:iactivator" main.py
          cd dist && zip -qry iActivator-mac.zip iActivator.app
      - uses: actions/upload-artifact@v7
        with:
          name: iActivator-${{ runner.os }}
          path: |
            dist/iActivator.exe
            dist/iActivator-mac.zip

  # Publish a GitHub Release so the app's built-in update check can find the new
  # version and the download page. Runs after both builds succeed.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - id: ver
        run: echo "v=$(grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' iactivator/__init__.py | head -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: iActivator v${{ steps.ver.outputs.v }}
          files: |
            artifacts/iActivator-Windows/iActivator.exe
            artifacts/iActivator-macOS/iActivator-mac.zip
