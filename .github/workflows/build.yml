# Builds iActivator for Windows and macOS on GitHub's machines.
# Run it from the repository's Actions tab ("Run workflow"); the results appear as artifacts.
name: build
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false  # a missing macOS runner must not cancel the Windows build
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt -c constraints.txt
      - name: Tests
        run: python -m unittest discover tests
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: python build.py
      - name: Installer and portable zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $v = (Select-String -Path iactivator/__init__.py -Pattern '[0-9]+\.[0-9]+(\.[0-9]+)?').Matches[0].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer\iActivator.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist\iActivator -DestinationPath dist\iActivator-windows-portable.zip
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          python build.py
          cd dist && ditto -c -k --keepParent iActivator.app iActivator-macos.zip
      - uses: actions/upload-artifact@v7
        with:
          name: iActivator-${{ runner.os }}
          path: |
            dist/iActivator-windows-setup.exe
            dist/iActivator-windows-portable.zip
            dist/iActivator-macos.zip

  # Create the GitHub Release as a DRAFT: neither users nor the app's update check see it
  # until "Publish release" is pressed on GitHub, so the files can be tried first.
  # Runs after both builds succeed.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - id: ver
        run: echo "v=$(grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' iactivator/__init__.py | head -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: iActivator v${{ steps.ver.outputs.v }}
          draft: true
          files: |
            artifacts/iActivator-Windows/iActivator-windows-setup.exe
            artifacts/iActivator-Windows/iActivator-windows-portable.zip
            artifacts/iActivator-macOS/iActivator-macos.zip
